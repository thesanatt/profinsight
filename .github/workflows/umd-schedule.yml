name: UMD Schedule — nightly refresh

# Scrapes UMD's Testudo Schedule of Classes for the current term, joins
# instructors to professor IDs, and publishes data/umd_schedule.json to the
# rolling data release. The Render deploy hook then restarts the API so the
# "Teaching now" cards pick up the new term data.

on:
  schedule:
    # 04:30 UTC nightly. Shares the data-refresh concurrency group, so it
    # queues behind a running nightly refresh instead of racing it.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      term:
        description: 'Term code YYYYMM (e.g. 202608). Blank = Testudo current.'
        required: false
        default: ''

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pull UMD analyzed data and the current schedule
        run: |
          python fetch_data.py --schools umd
          cp data/umd_schedule.json /tmp/umd_schedule_before.json 2>/dev/null || true

      - name: Scrape Testudo + join instructors
        env:
          TERM: ${{ github.event.inputs.term }}
        run: |
          if [ -n "$TERM" ]; then
            python umd_scheduler.py --term "$TERM"
          else
            python umd_scheduler.py
          fi

      - name: Sanity check output
        run: |
          python - <<'PY'
          import json, sys
          try:
              d = json.load(open('data/umd_schedule.json'))
          except Exception as e:
              print('SANITY FAIL: schedule JSON invalid:', e); sys.exit(1)
          if d.get('n_sections', 0) < 100:
              print(f"SANITY FAIL: only {d.get('n_sections')} sections — Testudo likely blocked us"); sys.exit(1)
          print(f"OK: {d['n_sections']} sections in {d['term_label']}.")
          PY

      - name: Detect changes
        id: check
        run: |
          # scraped_at changes every run; only publish when sections or
          # matches actually changed.
          python - <<'PY'
          import json, os
          new = json.load(open('data/umd_schedule.json'))
          try:
              old = json.load(open('/tmp/umd_schedule_before.json'))
          except Exception:
              old = None
          def strip(d):
              if d is None: return None
              d = dict(d); d.pop('scraped_at', None); return d
          changed = strip(old) != strip(new)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          print('changed' if changed else 'no change beyond scraped_at')
          PY

      - name: Publish schedule to the data release
        if: steps.check.outputs.changed == 'true'
        run: python publish_data.py --schedule-only umd

      - name: Trigger Render deploy
        if: steps.check.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set; skipping deploy trigger"
          fi
