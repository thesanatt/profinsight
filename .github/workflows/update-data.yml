name: Nightly Data Refresh

# Rotation strategy:
# The school list is ~80 entries. Scraping all of them in one run would blow
# the 6-hour GitHub Actions budget and would be uncourteous to
# RateMyProfessors' servers. Instead we split into 3 deterministic batches by
# slug. Each night we run one batch (batch index = day-of-year mod 3), so
# every school refreshes about every 3 days.
#
# Data never touches git. The job pulls the current snapshot from the rolling
# GitHub release `data-latest`, refreshes one batch, retrains the topic
# classifier, uploads the changed assets back to the release, and pokes
# Render's deploy hook so the API restarts on the new snapshot.

on:
  schedule:
    # 03:00 UTC nightly (≈ 11pm ET the previous evening).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      batch_override:
        description: 'Batch to run as i/N (e.g. 0/3). Leave blank for auto-rotation.'
        required: false
        default: ''
      max_professors:
        description: 'Cap per school (0 = unlimited, default 1500).'
        required: false
        default: '1500'
      stale_days:
        description: 'Only refresh schools older than this many days (blank = ignore staleness).'
        required: false
        default: ''

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write   # release asset uploads

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5h40m; leaves a buffer under the 6h ceiling
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull current data snapshot
        run: python fetch_data.py --raw

      - name: Pick batch
        id: batch
        run: |
          # If the user passed a batch override via workflow_dispatch, use it.
          # Otherwise rotate by day-of-year mod 3.
          if [ -n "${{ github.event.inputs.batch_override }}" ]; then
            BATCH="${{ github.event.inputs.batch_override }}"
          else
            DOY=$(date -u +%j)
            BATCH="$(( 10#$DOY % 3 ))/3"
          fi
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "slugs=$(python -c "import bulk_update as b; print(','.join(b.batch_slugs('$BATCH')))")" >> "$GITHUB_OUTPUT"
          echo "Batch $BATCH"

      - name: Refresh batch
        run: |
          MAX="${{ github.event.inputs.max_professors || '1500' }}"
          STALE_FLAG=""
          if [ -n "${{ github.event.inputs.stale_days }}" ]; then
            STALE_FLAG="--stale-days ${{ github.event.inputs.stale_days }}"
          fi
          echo "Batch: ${{ steps.batch.outputs.batch }}  (${{ steps.batch.outputs.slugs }})"
          echo "Max professors: $MAX"
          python bulk_update.py \
            --all \
            --batch "${{ steps.batch.outputs.batch }}" \
            --max-professors "$MAX" \
            $STALE_FLAG

      - name: Retrain topic classifier on the current corpus
        run: python train_classifier.py

      - name: Quick sanity checks on output
        run: |
          # Fail fast if the refresh destroyed anything: every analyzed file
          # must be valid and carry the calibration block.
          python - <<'PY'
          import sys
          from datafiles import list_analyzed, load_json
          bad = []
          for f in list_analyzed('data'):
              try:
                  d = load_json(f)
                  if 'calibration' not in d or 'analysis' not in d:
                      bad.append(f)
                  elif not d['analysis']:
                      print(f'WARNING: {f} has zero professors')
              except Exception as e:
                  bad.append(f'{f} :: {e}')
          if bad:
              print('SANITY FAILURES:')
              for b in bad:
                  print(' ', b)
              sys.exit(1)
          print(f'OK: {len(list_analyzed("data"))} analyzed files valid.')
          PY

      - name: Publish refreshed assets to the data release
        run: |
          python publish_data.py --schools "${{ steps.batch.outputs.slugs }}" --model

      - name: Trigger Render deploy
        # Render's GitHub auto-deploy only fires on commits; data lives in the
        # release now, so the API is restarted through the deploy hook.
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set; skipping deploy trigger"
          fi
